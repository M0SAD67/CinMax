<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineMax - Stream & Download</title>
  
  <meta name="description" content="Watch and download movies, series, and anime in high quality on CineMax." />
  <meta property="og:site_name" content="CineMax" />
  <meta property="og:title" id="og-title" content="CineMax - Stream & Download" />
  <meta property="og:description" id="og-desc" content="Watch and download in high quality on CineMax." />
  <meta property="og:image" id="og-image" content="https://m0sad67.github.io/CinMax/assets/icon.png" />
  <meta name="theme-color" content="#0B0F19" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #07090E;
      --card-bg: rgba(18, 24, 38, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #E50914;
      --primary-glow: rgba(229, 9, 20, 0.4);
      --accent-telegram: #229ED9;
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Glow */
    .bg-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--primary-glow) 0%, rgba(7, 9, 14, 0) 70%);
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.6;
      transition: background 0.5s ease;
    }

    .backdrop-blur-img {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      filter: blur(40px) brightness(0.25);
      z-index: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      opacity: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* App Brand Header */
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      padding: 6px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
    }

    .brand-logo {
      width: 20px;
      height: 20px;
      background: var(--primary);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 11px;
      color: #fff;
    }

    .brand-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #F8FAFC;
    }

    /* Poster */
    .poster-wrapper {
      position: relative;
      width: 160px;
      height: 240px;
      margin: 0 auto 20px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
      background: #111827;
    }

    .poster-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .poster-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      background: linear-gradient(135deg, #1E293B, #0F172A);
    }

    /* Title & Meta */
    .title {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 8px;
      color: #FFFFFF;
      word-break: break-word;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .status-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: #10B981;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 18px;
    }

    /* Action Buttons */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #E50914, #B80610);
      color: #FFFFFF;
      box-shadow: 0 8px 24px rgba(229, 9, 20, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(229, 9, 20, 0.5);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #F1F5F9;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-telegram {
      background: rgba(34, 158, 217, 0.12);
      color: #38BDF8;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .btn-telegram:hover {
      background: rgba(34, 158, 217, 0.2);
    }

    .btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: #64748B;
    }

    .footer-note a {
      color: #94A3B8;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Ambient background glow & blurred backdrop -->
  <div class="bg-glow"></div>
  <img id="bg-blur" class="backdrop-blur-img" alt="" />

  <div class="container">
    <!-- Brand -->
    <div class="brand">
      <div class="brand-logo">C</div>
      <div class="brand-name">CINEMAX</div>
    </div>

    <!-- Poster -->
    <div class="poster-wrapper">
      <img id="poster" class="poster-img" style="display: none;" alt="Poster" />
      <div id="poster-fallback" class="poster-fallback">🍿</div>
    </div>

    <!-- Title & Description -->
    <h1 id="title" class="title">CineMax</h1>
    <div id="status-badge" class="status-badge" style="display: none;">Ready to Stream</div>
    <p id="subtitle" class="subtitle">Watch and download high-quality movies, series, and anime without ads.</p>

    <!-- Buttons -->
    <div class="btn-group">
      <a id="open-app-btn" class="btn btn-primary" href="#">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        Open in CineMax App
      </a>

      <a id="telegram-btn" class="btn btn-telegram" href="https://t.me/CineMax0Updates" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.52 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
        Get the App (Telegram)
      </a>
    </div>

    <div class="footer-note">
      If the app didn't open automatically, tap <strong>Open in CineMax App</strong> above.
    </div>
  </div>

  <script>
    (function() {
      // 1. Helper to decode UTF-8 URL-Safe Base64
      function decodeBase64UrlSafeUtf8(base64url) {
        try {
          let base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
          while (base64.length % 4) {
            base64 += '=';
          }
          const binary = atob(base64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }
          const decoder = new TextDecoder('utf-8');
          return JSON.parse(decoder.decode(bytes));
        } catch (e) {
          console.warn("Could not decode payload:", e);
          return null;
        }
      }

      // 2. Extract payload query param 'd'
      const urlParams = new URLSearchParams(window.location.search);
      const rawPayload = urlParams.get('d');

      let appDeepLink = "cinemax://details";

      if (rawPayload) {
        appDeepLink = "cinemax://details?d=" + encodeURIComponent(rawPayload);
        const data = decodeBase64UrlSafeUtf8(rawPayload);

        if (data) {
          const title = data.t || 'CineMax';
          const poster = data.p || '';
          
          document.title = title + " - CineMax";
          document.getElementById('title').textContent = title;
          document.getElementById('status-badge').style.display = 'inline-block';
          document.getElementById('subtitle').textContent = "Stream or download \"" + title + "\" on CineMax.";

          if (poster && poster.startsWith('http')) {
            const posterEl = document.getElementById('poster');
            const posterFallback = document.getElementById('poster-fallback');
            const bgBlur = document.getElementById('bg-blur');

            posterEl.src = poster;
            posterEl.onload = function() {
              posterEl.style.display = 'block';
              posterFallback.style.display = 'none';
              bgBlur.src = poster;
              bgBlur.style.opacity = '0.4';
            };
            posterEl.onerror = function() {
              posterEl.style.display = 'none';
              posterFallback.style.display = 'flex';
            };
          }
        }
      }

      // 3. Set Open in App Button
      const openBtn = document.getElementById('open-app-btn');
      openBtn.href = appDeepLink;

      // 4. Auto-launch app redirect on mobile devices
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (isMobile && rawPayload) {
        // Small delay to let DOM render first
        setTimeout(function() {
          window.location.href = appDeepLink;
        }, 400);
      }
    })();
  </script>
</body>
</html>
