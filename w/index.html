<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineMax - Watch & Download</title>
  
  <meta name="description" content="Watch and download movies, series, and anime in high quality on CineMax." />
  <meta property="og:site_name" content="CineMax" />
  <meta property="og:title" id="og-title" content="CineMax - Watch & Download" />
  <meta property="og:description" id="og-desc" content="Watch and download in high quality on CineMax." />
  <meta property="og:image" id="og-image" content="https://m0sad67.github.io/CinMax/assets/icon.png" />
  <meta name="theme-color" content="#07090E" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #07090E;
      --card-bg: rgba(18, 20, 28, 0.78);
      --card-border: rgba(232, 196, 104, 0.16);
      
      /* CineMax Golden Blade Theme */
      --blade-gold: #E8C468;
      --blade-glow: #FFF6DF;
      --blade-bronze: #9C6F19;
      --blade-dark: #140D04;
      --blade-glow-ambient: rgba(232, 196, 104, 0.25);
      
      --accent-teal: #00BFA5;
      --accent-telegram: #229ED9;
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Glow (Golden Blade) */
    .bg-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, var(--blade-glow-ambient) 0%, rgba(0, 191, 165, 0.08) 40%, rgba(7, 9, 14, 0) 70%);
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.7;
      transition: background 0.5s ease;
    }

    .backdrop-blur-img {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      filter: blur(45px) brightness(0.22);
      z-index: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      opacity: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 30px rgba(232, 196, 104, 0.08);
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* App Brand Header with 5-Blade Spinner */
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      padding: 7px 18px 7px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(232, 196, 104, 0.2);
      border-radius: 999px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .brand-spinner-wrapper {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-spinner {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    @keyframes bladeSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .spinning-iris {
      transform-origin: 256px 256px;
      animation: bladeSpin 9s linear infinite;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: var(--blade-glow);
      text-shadow: 0 0 12px rgba(232, 196, 104, 0.4);
    }

    /* Poster */
    .poster-wrapper {
      position: relative;
      width: 160px;
      height: 240px;
      margin: 0 auto 20px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(232, 196, 104, 0.2);
      background: #111827;
    }

    .poster-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .poster-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      background: linear-gradient(135deg, #1A1813, #0F0E0B);
    }

    /* Title & Meta */
    .title {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 8px;
      color: #FFFFFF;
      word-break: break-word;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .status-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: var(--blade-gold);
      background: rgba(232, 196, 104, 0.12);
      border: 1px solid rgba(232, 196, 104, 0.28);
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(232, 196, 104, 0.15);
    }

    /* Action Buttons */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.25s ease;
    }

    /* 3D Golden Blade Button */
    .btn-blade {
      background: linear-gradient(135deg, #FFF6DF 0%, #E8C468 45%, #9C6F19 100%);
      color: var(--blade-dark);
      font-weight: 800;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 24px rgba(232, 196, 104, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 246, 223, 0.4);
    }

    .btn-blade:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(232, 196, 104, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.8);
      filter: brightness(1.04);
    }

    .btn-blade:active {
      transform: translateY(0);
      filter: brightness(0.96);
    }

    .btn-blade svg {
      fill: var(--blade-dark);
    }

    .btn-telegram {
      background: rgba(34, 158, 217, 0.12);
      color: #38BDF8;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .btn-telegram:hover {
      background: rgba(34, 158, 217, 0.2);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: #717A8C;
      line-height: 1.5;
    }

    .footer-note strong {
      color: var(--blade-glow);
    }
  </style>
</head>
<body>

  <!-- Ambient background glow & blurred backdrop -->
  <div class="bg-glow"></div>
  <img id="bg-blur" class="backdrop-blur-img" alt="" />

  <div class="container">
    <!-- CineMax Brand Header with Signature 5-Blade Spinner -->
    <div class="brand">
      <div class="brand-spinner-wrapper">
        <svg class="brand-spinner" viewBox="0 0 512 512">
          <defs>
            <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFF6DF" />
              <stop offset="50%" stop-color="#E8C468" />
              <stop offset="100%" stop-color="#9C6F19" />
            </linearGradient>
            <radialGradient id="lensGrad" cx="35%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#FFFFFF" />
              <stop offset="45%" stop-color="#FFF6DF" />
              <stop offset="100%" stop-color="#E8C468" />
            </radialGradient>
            <path id="bladeShape" d="M256,286.24 L334.22,381.17 Q256,350.46 177.78,381.17 Z" fill="url(#bladeGrad)" stroke="#FFF6DF" stroke-width="3" stroke-opacity="0.9" />
          </defs>
          <g class="spinning-iris">
            <use href="#bladeShape" />
            <use href="#bladeShape" transform="rotate(72 256 256)" />
            <use href="#bladeShape" transform="rotate(144 256 256)" />
            <use href="#bladeShape" transform="rotate(216 256 256)" />
            <use href="#bladeShape" transform="rotate(288 256 256)" />
            <circle cx="256" cy="256" r="32" fill="url(#lensGrad)" />
          </g>
        </svg>
      </div>
      <div class="brand-name">CINEMAX</div>
    </div>

    <!-- Poster -->
    <div class="poster-wrapper">
      <img id="poster" class="poster-img" style="display: none;" alt="Poster" />
      <div id="poster-fallback" class="poster-fallback">🍿</div>
    </div>

    <!-- Title & Description -->
    <h1 id="title" class="title">CineMax</h1>
    <div id="status-badge" class="status-badge" style="display: none;">Ready to Watch</div>
    <p id="subtitle" class="subtitle">Watch and download high-quality movies, series, and anime without ads.</p>

    <!-- Buttons -->
    <div class="btn-group">
      <a id="open-app-btn" class="btn btn-blade" href="#">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        Open in CineMax App
      </a>

      <a id="telegram-btn" class="btn btn-telegram" href="https://t.me/CineMax0Updates" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.52 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
        Get the App (Telegram)
      </a>
    </div>

    <div class="footer-note">
      If the app didn't open automatically, tap <strong>Open in CineMax App</strong> above.
    </div>
  </div>

  <script>
    (function() {
      // 1. Helper to decode UTF-8 URL-Safe Base64
      function decodeBase64UrlSafeUtf8(base64url) {
        try {
          let base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
          while (base64.length % 4) {
            base64 += '=';
          }
          const binary = atob(base64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }
          const decoder = new TextDecoder('utf-8');
          return JSON.parse(decoder.decode(bytes));
        } catch (e) {
          console.warn("Could not decode payload:", e);
          return null;
        }
      }

      // 2. Extract payload query param 'd'
      const urlParams = new URLSearchParams(window.location.search);
      const rawPayload = urlParams.get('d');

      let appDeepLink = "cinemax://details";

      if (rawPayload) {
        appDeepLink = "cinemax://details?d=" + encodeURIComponent(rawPayload);
        const data = decodeBase64UrlSafeUtf8(rawPayload);

        if (data) {
          const title = data.t || 'CineMax';
          const poster = data.p || '';
          
          document.title = title + " - CineMax";
          document.getElementById('title').textContent = title;
          document.getElementById('status-badge').style.display = 'inline-block';
          document.getElementById('subtitle').textContent = "Watch and download \"" + title + "\" on CineMax.";

          if (poster && poster.startsWith('http')) {
            const posterEl = document.getElementById('poster');
            const posterFallback = document.getElementById('poster-fallback');
            const bgBlur = document.getElementById('bg-blur');

            posterEl.src = poster;
            posterEl.onload = function() {
              posterEl.style.display = 'block';
              posterFallback.style.display = 'none';
              bgBlur.src = poster;
              bgBlur.style.opacity = '0.35';
            };
            posterEl.onerror = function() {
              posterEl.style.display = 'none';
              posterFallback.style.display = 'flex';
            };
          }
        }
      }

      // 3. Set Open in App Button
      const openBtn = document.getElementById('open-app-btn');
      openBtn.href = appDeepLink;

      // 4. Auto-launch app redirect on mobile devices
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (isMobile && rawPayload) {
        // Small delay to let DOM render first
        setTimeout(function() {
          window.location.href = appDeepLink;
        }, 400);
      }
    })();
  </script>
</body>
</html>
