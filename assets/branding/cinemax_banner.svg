<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <!-- Deep cinema background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140C05"/>
      <stop offset="0.5" stop-color="#1C1208"/>
      <stop offset="1" stop-color="#0B0703"/>
    </linearGradient>

    <!-- Warm spotlight behind the aperture -->
    <radialGradient id="spot" gradientUnits="userSpaceOnUse" cx="200" cy="190" r="320">
      <stop offset="0" stop-color="#E8C468" stop-opacity="0.30"/>
      <stop offset="0.35" stop-color="#C9973A" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft glow behind the wordmark -->
    <radialGradient id="spot2" gradientUnits="userSpaceOnUse" cx="760" cy="170" r="420">
      <stop offset="0" stop-color="#E8C468" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Edge vignette -->
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>

    <!-- Light rays from the aperture -->
    <linearGradient id="ray" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#F5D98C" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F5D98C" stop-opacity="0"/>
    </linearGradient>

    <!-- Fading gold accent line -->
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8C468" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E8C468" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#E8C468" stop-opacity="0"/>
    </linearGradient>

    <!-- Film perforation pattern -->
    <pattern id="perf" width="30" height="14" patternUnits="userSpaceOnUse">
      <rect x="8" y="2" width="14" height="10" rx="2.5" fill="#E8C468" fill-opacity="0.2"/>
    </pattern>

    <!-- Fade perforations toward the edges -->
    <linearGradient id="perfFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.8" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="perfMask">
      <rect width="1200" height="380" fill="url(#perfFade)"/>
    </mask>

    <!-- Gold gradients (user space so horizontal strokes render) -->
    <linearGradient id="gold_icon" gradientUnits="userSpaceOnUse" x1="51.2" y1="0" x2="460.8" y2="512">
      <stop offset="0" stop-color="#FCE6AC"/>
      <stop offset="0.55" stop-color="#E8C468"/>
      <stop offset="1" stop-color="#9C6F19"/>
    </linearGradient>
    <linearGradient id="gold_text" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="870" y2="220">
      <stop offset="0" stop-color="#FCE6AC"/>
      <stop offset="0.55" stop-color="#E8C468"/>
      <stop offset="1" stop-color="#9C6F19"/>
    </linearGradient>
    <radialGradient id="lens" gradientUnits="userSpaceOnUse" cx="248.66" cy="246.21" r="34.27">
      <stop offset="0" stop-color="#FFF6DF"/>
      <stop offset="0.55" stop-color="#E8C468"/>
      <stop offset="1" stop-color="#8A6215"/>
    </radialGradient>

    <clipPath id="card">
      <rect width="1200" height="380" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- Background layers -->
    <rect width="1200" height="380" fill="url(#bg)"/>
    <polygon points="200,190 1200,40 1200,120" fill="url(#ray)"/>
    <polygon points="200,190 1200,250 1200,340" fill="url(#ray)"/>
    <polygon points="200,190 1200,150 1200,200" fill="url(#ray)" opacity="0.6"/>
    <rect width="1200" height="380" fill="url(#spot)"/>
    <rect width="1200" height="380" fill="url(#spot2)"/>

    <!-- Film strip edges -->
    <g mask="url(#perfMask)">
      <rect x="0" y="0" width="1200" height="30" fill="#000" fill-opacity="0.35"/>
      <rect x="0" y="8" width="1200" height="14" fill="url(#perf)"/>
      <rect x="0" y="350" width="1200" height="30" fill="#000" fill-opacity="0.35"/>
      <rect x="0" y="358" width="1200" height="14" fill="url(#perf)"/>
    </g>
    <rect x="0" y="30" width="1200" height="1.5" fill="url(#line)"/>
    <rect x="0" y="348.5" width="1200" height="1.5" fill="url(#line)"/>

    <rect width="1200" height="380" fill="url(#vignette)"/>
  </g>

  <!-- Aperture icon -->
  <g transform="translate(200 190) scale(0.9) translate(-256 -245)">
    <g fill="url(#gold_icon)">
      <path d="M 256.00,286.24 L 334.22,381.17 Q 256.00,350.46 177.78,381.17 Z"/>
      <path d="M 227.24,265.34 L 161.12,369.07 Q 166.16,285.19 112.78,220.29 Z"/>
      <path d="M 238.23,231.54 L 119.15,200.71 Q 200.48,179.58 245.70,108.76 Z"/>
      <path d="M 273.77,231.54 L 266.30,108.76 Q 311.52,179.58 392.85,200.71 Z"/>
      <path d="M 284.76,265.34 L 399.22,220.29 Q 345.84,285.19 350.88,369.07 Z"/>
    </g>
    <path d="M 231.52,256 A 24.48,24.48 0 1,0 280.48,256 A 24.48,24.48 0 1,0 231.52,256 Z" fill="url(#lens)" stroke="#4A3512" stroke-width="2.5" stroke-opacity="0.5"/>
    <path d="M 242.18,246.21 A 6.48,4.32 0 1,0 255.14,246.21 A 6.48,4.32 0 1,0 242.18,246.21 Z" fill="#FFF8E8" fill-opacity="0.75"/>
  </g>

  <!-- Vertical divider between icon and wordmark -->
  <rect x="378" y="105" width="1.5" height="170" fill="#E8C468" fill-opacity="0.25"/>

  <!-- CINEMAX wordmark (from intro animation) -->
  <g transform="translate(395 45) scale(0.86)">
    <path d="M 30,205 C 253,225 583,225 830,205" stroke="url(#gold_text)" stroke-width="6" stroke-linecap="round" stroke-opacity="0.6" fill="none"/>
    <g stroke="url(#gold_text)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 100,65 C 55,60 25,90 28,132 C 31,174 60,202 105,198" stroke-width="15"/>
      <path d="M 148,68 C 146,110 146,155 152,196" stroke-width="14"/>
      <path d="M 195,198 L 192,66 L 280,196 L 280,66" stroke-width="15"/>
      <path d="M 405,68 L 337,64 L 335,196 L 405,198" stroke-width="14"/>
      <path d="M 336,131 L 390,131" stroke-width="14"/>
      <path d="M 440,198 C 438,152 436,106 438,66 C 465,108 490,148 495,155 C 502,146 528,106 555,66 C 555,110 555,155 553,198" stroke-width="15"/>
      <path d="M 598,197 C 613,153 628,109 640,64 C 654,108 668,152 680,196" stroke-width="15"/>
      <path d="M 610,148 C 628,145 648,146 665,150" stroke-width="15"/>
      <path d="M 715,68 C 745,108 775,150 793,196 M 795,66 C 767,108 738,152 718,194" stroke-width="15"/>
    </g>
    <circle cx="148" cy="45" r="6.5" fill="url(#gold_text)"/>
    <circle cx="835" cy="205" r="6.5" fill="url(#gold_text)" opacity="0.85"/>
  </g>

  <text x="770" y="300" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="10" fill="#E8C468" fill-opacity="0.85">MOVIES • TV SERIES • ANIME</text>
</svg>
